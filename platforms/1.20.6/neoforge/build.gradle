plugins { id 'net.neoforged.moddev' version '2.0.147' }

neoForge {
    version = providers.gradleProperty('neo_version').getOrElse('20.6.141')
    mods {
        qizhangverdict { sourceSet(sourceSets.main) }
    }
    unitTest {
        enable()
        testedMod = mods.qizhangverdict
    }
    runs {
        client {
            client()
            gameDirectory = new File(rootProject.qzRuntimeDirectory, 'neoforge-client')
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = new File(rootProject.qzRuntimeDirectory, 'neoforge-server')
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
sourceSets.test.java.srcDir rootProject.file('common/src/smoke/java')

def qzJUnitDirectory = new File(rootProject.qzRuntimeDirectory, 'neoforge-junit')
// ModDev 2.0.147 sets both this task's gameDirectory and Test.workingDir to
// build/minecraft-junit. Override its existing task and its afterEvaluate hook;
// keep the official FML test bootstrap, arguments and classpath intact.
tasks.named('prepareNeoForgeTestFiles') {
    gameDirectory.set(qzJUnitDirectory)
    inputs.property 'qizhangverdictJUnitGameDirectory', qzJUnitDirectory.absolutePath
}
afterEvaluate {
    tasks.named('test', Test) { workingDir = qzJUnitDirectory }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    maxHeapSize = '768m'
    inputs.property 'qizhangverdictJUnitGameDirectory', qzJUnitDirectory.absolutePath
    doFirst {
        if (workingDir.canonicalFile != qzJUnitDirectory.canonicalFile) {
            throw new GradleException('FML JUnit working directory drifted outside the configured runtime directory')
        }
        workingDir.mkdirs()
    }
    testLogging { events 'passed', 'failed', 'skipped'; showStandardStreams = true }
}

tasks.register('clientChallengeDispatchSmoke', JavaExec) {
    dependsOn tasks.named('smokeClasses')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'cn.qizhang.guard.neoforge.ClientChallengeDispatchSmoke'
    maxHeapSize = '128m'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    workingDir = new File(rootProject.qzRuntimeDirectory, 'neoforge-dispatch')
    doFirst { workingDir.mkdirs() }
}
tasks.named('check') { dependsOn tasks.named('clientChallengeDispatchSmoke') }
