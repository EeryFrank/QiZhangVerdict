plugins { id 'base' }
allprojects { group = 'cn.qizhang.guard'; version = '0.4.0-dev' }
def runtimeRoot = providers.gradleProperty('qzRuntimeRoot').getOrElse(
    System.getProperty('os.name').toLowerCase().contains('windows')
    ? 'E:/CodexTemp/QiZhangVerdict/runtime/1.21.11'
    : new File(System.getProperty('java.io.tmpdir'), 'qizhangverdict-1.21.11-runtime').absolutePath)
ext.qzRuntimeDirectory = file(runtimeRoot)
subprojects {
    apply plugin: 'java'
    ext.qvLicenseRoot = rootProject.file('../..')
    apply from: new File(qvLicenseRoot, 'gradle/license-resources.gradle')
    base { archivesName = "qizhangverdict-${project.name}-1.21.11" }
    repositories {
        mavenCentral()
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.neoforged.net/releases/' }
    }
    sourceSets.main.java.srcDirs += [rootProject.file('../../core/src/main/java'),
        rootProject.file('../../client-common/src/main/java'), rootProject.file('common/src/main/java')]
    sourceSets.main.resources.srcDir rootProject.file('../../core/src/main/resources')
    // Main-method regression programs have their own source set. Keep the
    // standard Test task strict for any future JUnit tests under src/test.
    sourceSets {
        smoke {
            java.srcDir rootProject.file('common/src/smoke/java')
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    // Fabric can initialize the vanilla registries in an ordinary JVM. NeoForge
    // uses its official JUnit bootstrap so patched classes see a real FML loader.
    if (project.name == 'fabric') {
      ['commandParserSmoke': 'CommandParserSmoke', 'payloadCodecSmoke': 'PayloadCodecSmoke'].each { taskName, className ->
        tasks.register(taskName, JavaExec) {
            dependsOn tasks.named('smokeClasses')
            classpath = sourceSets.smoke.runtimeClasspath
            mainClass = 'cn.qizhang.guard.minecraft.' + className
            maxHeapSize = '256m'
            javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
            workingDir = new File(runtimeRoot, project.name + '-' + taskName)
            doFirst { workingDir.mkdirs() }
        }
      }
      tasks.named('check') { dependsOn tasks.named('commandParserSmoke'), tasks.named('payloadCodecSmoke') }
    }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
    java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
    processResources {
        inputs.property 'version', project.version
        filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) { expand version: project.version }
    }
}
