plugins { id 'fabric-loom' version '1.14.10' }

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11'
}

loom {
    mixin { useLegacyMixinAp = true; defaultRefmapName = 'qizhangverdict.refmap.json' }
    runs {
        client { runDir new File(rootProject.qzRuntimeDirectory, 'fabric-client').absolutePath }
        server { runDir new File(rootProject.qzRuntimeDirectory, 'fabric-server').absolutePath }
    }
}

tasks.register('clientChallengeDispatchSmoke', JavaExec) {
    dependsOn tasks.named('smokeClasses')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'cn.qizhang.guard.fabric.ClientChallengeDispatchSmoke'
    maxHeapSize = '128m'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    workingDir = new File(rootProject.qzRuntimeDirectory, 'fabric-client-dispatch')
    doFirst { workingDir.mkdirs() }
}
tasks.named('check') { dependsOn tasks.named('clientChallengeDispatchSmoke') }
