plugins {
 id 'dev.architectury.loom' version '1.11.456' apply false
 id 'architectury-plugin' version '3.4.164'
}
architectury { minecraft = '1.20.1' }
allprojects { group = 'cn.qizhang.guard'; version = '0.1.0' }
subprojects {
 apply plugin: 'dev.architectury.loom'
 apply plugin: 'architectury-plugin'
 base { archivesName = "qizhangverdict-${project.name}-1.20.1" }
 repositories { mavenCentral(); maven { url 'https://maven.fabricmc.net/' }; maven { url 'https://maven.architectury.dev/' }; maven { url 'https://maven.neoforged.net/releases/' }; maven { url 'https://maven.minecraftforge.net/' } }
 dependencies { minecraft 'com.mojang:minecraft:1.20.1'; mappings loom.officialMojangMappings() }
 sourceSets.main.java.srcDirs += [rootProject.file('../../core/src/main/java'), rootProject.file('../../client-common/src/main/java'), rootProject.file('../shared/src/main/java')]
 sourceSets.main.resources.srcDir rootProject.file('../../core/src/main/resources')
 sourceSets.test.java.srcDir rootProject.file('../shared/src/test/java')
 tasks.register('commandParserSmoke', JavaExec) { dependsOn tasks.named('testClasses'); classpath = sourceSets.test.runtimeClasspath; mainClass = 'cn.qizhang.guard.minecraft.CommandParserSmoke' }
 tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
 java { toolchain.languageVersion = JavaLanguageVersion.of(17); withSourcesJar() }
 processResources { inputs.property 'version', project.version; filesMatching(['fabric.mod.json','META-INF/mods.toml','META-INF/neoforge.mods.toml']) { expand version: project.version } }
 loom { runs { server { runDir('E:/CodexTemp/QiZhangGuard/runtime/1.20.1/' + project.name) }; client { runDir('E:/CodexTemp/QiZhangGuard/runtime/1.20.1/' + project.name + '-client') } } }
}
