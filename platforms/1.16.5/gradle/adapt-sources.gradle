ext.qvAdaptations = adaptations
tasks.register('generateLegacySources') {
    inputs.files(adaptations.collect { rootProject.file(it.input) })
    inputs.file(rootProject.file('gradle/adapt-sources.gradle'))
    outputs.dir(layout.buildDirectory.dir('generated/legacy'))
    doLast {
        File destination = layout.buildDirectory.dir('generated/legacy').get().asFile
        adaptations.each { entry ->
            String source = rootProject.file(entry.input).getText('UTF-8')
            entry.changes.each { change -> source = checkedReplace(source, change[0], change[1], change[2]) }
            File output = new File(destination, entry.output)
            output.parentFile.mkdirs()
            output.setText(source, 'UTF-8')
        }
    }
}
