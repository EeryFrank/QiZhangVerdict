// Exact, reviewed Java 8/API bridges. Policy, wire, scope, VM rules and async ownership stay shared.
// Anchored counts fail the build when upstream source changes require a new adaptation review.
def checkedReplace = { String source, String before, String after, int expected ->
    int count = source.count(before)
    if (count != expected) throw new GradleException("1.16.5 bridge expected ${expected} occurrences of '${before}', found ${count}; review shared-source drift")
    source.replace(before, after)
}

def adaptations = [
