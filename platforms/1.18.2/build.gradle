plugins {
    id 'dev.architectury.loom' version '1.11.456' apply false
    id 'architectury-plugin' version '3.4.164'
}

architectury { minecraft = '1.18.2' }
allprojects { group = 'cn.qizhang.guard'; version = '0.2.0-dev' }

// These are API bridges, not forks of policy/client-reporting logic. Never rewrite shared files.
// Mojang 1.18.2: TextComponent(String), ServerPlayer.getLevel(), sendSuccess(Component, boolean).
def adaptLine = { String line ->
    line.replace('.serverLevel()', '.getLevel()')
        .replace('sendSuccess(() -> ', 'sendSuccess(')
        .replace('Component.literal(', 'new net.minecraft.network.chat.TextComponent(')
}
def defaultRuntimeRoot = System.getProperty('os.name').toLowerCase().contains('windows')
    ? 'E:/CodexTemp/QiZhangVerdict/legacy-build/1.18.2/runtime'
    : new File(System.getProperty('java.io.tmpdir'), 'qizhangverdict-1.18.2-runtime').absolutePath
def runtimeRoot = providers.gradleProperty('qzRuntimeRoot').getOrElse(defaultRuntimeRoot)

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    ext.qvLicenseRoot = rootProject.file('../..')
    apply from: new File(qvLicenseRoot, 'gradle/license-resources.gradle')
    base { archivesName = "qizhangverdict-${project.name}-1.18.2" }
    repositories {
        mavenCentral()
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.architectury.dev/' }
        maven { url 'https://maven.neoforged.net/releases/' }
        maven { url 'https://maven.minecraftforge.net/' }
    }
    dependencies {
        minecraft 'com.mojang:minecraft:1.18.2'
        mappings loom.officialMojangMappings()
    }

    def adaptedMain = layout.buildDirectory.dir('generated/sources/shared1182/main')
    def adaptedTest = layout.buildDirectory.dir('generated/sources/shared1182/test')
    def adaptMainTask = tasks.register('adaptSharedSources', Sync) {
        from(rootProject.file('../shared/src/main/java')) { exclude '**/mixin/**' }
        into adaptedMain
        filteringCharset = 'UTF-8'
        filter { line -> adaptLine(line) }
    }
    def adaptTestTask = tasks.register('adaptSharedTests', Sync) {
        from(rootProject.file('../shared/src/test/java'))
        into adaptedTest
        filteringCharset = 'UTF-8'
        filter { line -> adaptLine(line) }
    }
    sourceSets.main.java.srcDirs += [
        rootProject.file('../../core/src/main/java'),
        rootProject.file('../../client-common/src/main/java'),
        rootProject.file('src/main/java'),
        adaptedMain
    ]
    sourceSets.main.resources.srcDir rootProject.file('../../core/src/main/resources')
    sourceSets.test.java.srcDir adaptedTest
    tasks.named('compileJava') { dependsOn adaptMainTask }
    tasks.named('compileTestJava') { dependsOn adaptTestTask }
    tasks.register('commandParserSmoke', JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'cn.qizhang.guard.minecraft.CommandParserSmoke'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
        workingDir = new File(runtimeRoot, project.name + '-parser')
        doFirst { workingDir.mkdirs() }
    }
    tasks.named('check') { dependsOn tasks.named('commandParserSmoke') }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }
    java { toolchain.languageVersion = JavaLanguageVersion.of(17); withSourcesJar() }
    tasks.named('sourcesJar') { dependsOn adaptMainTask }
    processResources {
        inputs.property 'version', project.version
        filesMatching(['fabric.mod.json', 'META-INF/mods.toml']) { expand version: project.version }
    }
    loom {
        runs {
            server { runDir(new File(runtimeRoot, project.name + '-server').absolutePath) }
            client { runDir(new File(runtimeRoot, project.name + '-client').absolutePath) }
        }
    }
}
