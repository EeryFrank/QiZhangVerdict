plugins { id 'java-library' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
}
tasks.register('securityTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.qizhang.guard.core.SecurityRegressionTest'
}
tasks.named('check') { dependsOn tasks.named('securityTest') }

tasks.register('catalogCompatibilityTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.qizhang.guard.core.CatalogCompatibilityTest'
    args rootProject.file('catalog/blacklist-extension.tsv').absolutePath
}
tasks.named('check') { dependsOn tasks.named('catalogCompatibilityTest') }
