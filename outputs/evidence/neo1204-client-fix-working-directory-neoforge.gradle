architectury { platformSetupLoomIde(); neoForge() }
dependencies { neoForge 'net.neoforged:neoforge:20.4.251' }
tasks.named('jar') { manifest { attributes 'MixinConfigs': 'qizhangverdict.mixins.json' } }

tasks.register('clientChallengeDispatchSmoke', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.qizhang.guard.neoforge.ClientChallengeDispatchSmoke'
    maxHeapSize = '128m'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    workingDir = new File(providers.gradleProperty('qzRuntimeRoot').getOrElse(
        System.getProperty('os.name').toLowerCase().contains('windows')
        ? 'E:/CodexTemp/QiZhangVerdict/runtime/1.20.4'
        : new File(System.getProperty('java.io.tmpdir'), 'qizhangverdict-1.20.4-runtime').absolutePath), 'neoforge-client-dispatch')
    doFirst { workingDir.mkdirs() }
}
tasks.named('check') { dependsOn tasks.named('clientChallengeDispatchSmoke') }
