stages: [build, collect]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  image: eclipse-temurin:21-jdk-noble
  interruptible: true

variables:
  CI: 'true'
  GRADLE_USER_HOME: '$CI_PROJECT_DIR/.gradle-user'

# Independent legacy checks; these eight JARs are not added to modern collection.
legacy-build:
  stage: build
  image: eclipse-temurin:8-jdk-noble
  timeout: 1h
  parallel:
    matrix:
      - QV_MC: ['1.8.9', '1.12.2', '1.16.5', '1.18.2', '1.19.4']
  cache:
    key: 'legacy-gradle-${CI_COMMIT_REF_SLUG}-${QV_MC}'
    paths:
      - .gradle-user/caches/
      - .gradle-user/wrapper/
  before_script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openjdk-17-jdk-headless openjdk-21-jdk-headless python3
  script:
    - |
      export QV_JDK8="$JAVA_HOME"
      export QV_JDK17="/usr/lib/jvm/java-17-openjdk-$(dpkg --print-architecture)"
      export QV_JDK21="/usr/lib/jvm/java-21-openjdk-$(dpkg --print-architecture)"
      bash scripts/ci_legacy_build.sh
  artifacts:
    name: 'qizhangverdict-legacy-${QV_MC}-${CI_COMMIT_SHORT_SHA}'
    when: always
    expire_in: 14 days
    paths:
      - ci-artifacts/legacy-$QV_MC/
      - ci-logs/legacy-$QV_MC/

build:
  stage: build
  timeout: 1h
  parallel:
    matrix:
      - QV_TARGET: [core-bukkit, mods-1.17.1, mods-1.19.2, mods-1.20.1, mods-1.20.4, mods-1.20.6, mods-1.21.1, mods-1.21.11]
  cache:
    key: 'gradle-${CI_COMMIT_REF_SLUG}-${QV_TARGET}'
    paths:
      - .gradle-user/caches/
      - .gradle-user/wrapper/
  before_script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openjdk-17-jdk-headless python3 curl ca-certificates
  script:
    - |
      set -euo pipefail
      qv_jdk17="/usr/lib/jvm/java-17-openjdk-$(dpkg --print-architecture)"
      test -x "$qv_jdk17/bin/javac"
      test -x "$JAVA_HOME/bin/javac"
      "$JAVA_HOME/bin/java" -version
      "$qv_jdk17/bin/java" -version
      export GRADLE_USER_HOME="$CI_PROJECT_DIR/.gradle-user"
      export QV_JAVA_PATHS="$qv_jdk17,$JAVA_HOME"
      if [[ "$QV_TARGET" == mods-1.17.1 ]]; then
        # Official Adoptium 16.0.2+7 Linux x64: verify the fixed archive before extraction.
        test "$(dpkg --print-architecture)" = amd64
        qv_java16_dir="$CI_PROJECT_DIR/.ci-tests/toolchains/java16"
        test ! -e "$qv_java16_dir"
        mkdir -p "$qv_java16_dir"
        curl --fail --location --retry 3 --output "$qv_java16_dir/jdk16.tar.gz" \
          'https://github.com/adoptium/temurin16-binaries/releases/download/jdk-16.0.2%2B7/OpenJDK16U-jdk_x64_linux_hotspot_16.0.2_7.tar.gz'
        printf '%s  %s\n' '323d6d7474a359a28eff7ddd0df8e65bd61554a8ed12ef42fd9365349e573c2c' "$qv_java16_dir/jdk16.tar.gz" | sha256sum --check --strict -
        tar --extract --gzip --file "$qv_java16_dir/jdk16.tar.gz" --directory "$qv_java16_dir" --no-same-owner
        export QV_JAVA16_PATH="$qv_java16_dir/jdk-16.0.2+7"
        test -x "$QV_JAVA16_PATH/bin/java"
        test -x "$QV_JAVA16_PATH/bin/javac"
      fi
      bash scripts/ci_modern_build.sh
  artifacts:
    name: 'qizhangverdict-${QV_TARGET}-${CI_COMMIT_SHORT_SHA}'
    when: always
    expire_in: 14 days
    paths:
      - ci-artifacts/$QV_TARGET/
      - ci-logs/$QV_TARGET/

collect:
  stage: collect
  timeout: 10m
  needs:
    - job: build
      artifacts: true
  before_script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3
  script:
    - python3 -B scripts/ci_modern_artifacts.py collect --input ci-artifacts --output ci-release --layout gitlab
  artifacts:
    name: 'qizhangverdict-seventeen-modern-jars-${CI_COMMIT_SHORT_SHA}'
    expire_in: 30 days
    paths:
      - ci-release/
