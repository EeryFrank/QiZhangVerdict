# QiZhang's Verdict - merge into config/paper-world-defaults.yml; do not replace the whole file.
# Paper 1.21.1; restart after editing. These are vanilla ore rules, not custom mod ore coverage.
anticheat:
  anti-xray:
    enabled: true
    engine-mode: 2
    max-block-height: 320
    update-radius: 2
    lava-obscures: false
    use-permission: false
    hidden-blocks:
      - copper_ore
      - deepslate_copper_ore
      - coal_ore
      - deepslate_coal_ore
      - iron_ore
      - deepslate_iron_ore
      - gold_ore
      - deepslate_gold_ore
      - redstone_ore
      - deepslate_redstone_ore
      - lapis_ore
      - deepslate_lapis_ore
      - diamond_ore
      - deepslate_diamond_ore
      - emerald_ore
      - deepslate_emerald_ore
      - raw_copper_block
      - raw_iron_block
      - raw_gold_block
    replacement-blocks:
      - stone
      - deepslate
      - andesite
      - calcite
      - diorite
      - dirt
      - granite
      - gravel
      - sand
      - tuff
      - mossy_cobblestone
      - obsidian
      - clay
      - infested_stone
      - amethyst_block
      - budding_amethyst
      - chest
