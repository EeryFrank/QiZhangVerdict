# Merge into the actual Nether world folder's paper-world.yml (commonly world_nether/paper-world.yml).
anticheat:
  anti-xray:
    enabled: true
    engine-mode: 2
    max-block-height: 128
    update-radius: 2
    lava-obscures: true
    use-permission: false
    hidden-blocks:
      - ancient_debris
      - nether_gold_ore
      - nether_quartz_ore
    replacement-blocks:
      - netherrack
      - basalt
      - blackstone
      - soul_sand
      - soul_soil
      - gravel
