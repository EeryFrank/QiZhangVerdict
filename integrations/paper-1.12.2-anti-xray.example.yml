# Optional tested Paper 1.12.2 fragment; merge this section into the existing paper.yml.
# Preserve all unrelated settings and the server-generated config-version.
# Engine mode 1 hides fully enclosed listed ores; it does not ban client accounts.
world-settings:
  default:
    anti-xray:
      enabled: true
      engine-mode: 1
      max-chunk-section-index: 3
      update-radius: 2
      hidden-blocks: [gold_ore, iron_ore, coal_ore, lapis_ore, diamond_ore, redstone_ore, emerald_ore]
      replacement-blocks: [stone]
