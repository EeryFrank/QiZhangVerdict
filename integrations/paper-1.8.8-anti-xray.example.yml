# Optional tested Paper 1.8.8 fragment; merge this section into the existing spigot.yml.
# Preserve all unrelated settings and the server-generated config-version.
# Engine mode 1 hides fully enclosed listed ores; it does not ban client accounts.
world-settings:
  default:
    anti-xray:
      enabled: true
      engine-mode: 1
      hide-blocks: [14, 15, 16, 21, 56, 73, 74, 129]
      replace-blocks: [1, 5]
