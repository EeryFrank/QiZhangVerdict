name: Build and check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [core-bukkit, mods-1.19.2, mods-1.20.1, mods-1.20.4, mods-1.21.1]
    env:
      QV_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install JDK 17 toolchain
        id: jdk17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Run Gradle on JDK 21
        id: jdk21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build and run required regressions
        shell: bash
        env:
          QV_JAVA_PATHS: ${{ steps.jdk17.outputs.path }},${{ steps.jdk21.outputs.path }}
        run: bash scripts/ci_modern_build.sh
      - name: Save build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qizhang-logs-${{ matrix.target }}
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save checked JARs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qizhang-ci-${{ matrix.target }}
          path: ci-artifacts/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

  collect:
    name: Collect ten modern JARs
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: qizhang-ci-*
          path: ci-input
          merge-multiple: false
      - name: Verify all ten exact modern deliverables
        shell: bash
        run: python3 -B scripts/ci_modern_artifacts.py collect --input ci-input --output ci-release --layout github
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qizhangverdict-ten-modern-jars-${{ github.sha }}
          path: ci-release/
          if-no-files-found: error
          retention-days: 30
